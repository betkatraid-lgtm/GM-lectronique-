
<style>
input,textarea,select{
 width:100%;padding:12px;margin:7px 0 13px;
 background:#091426;color:white;border:1px solid #29466a;
 border-radius:8px
}
label{color:#c5d9f5}
.hidden{display:none!important}
footer{text-align:center;padding:25px;background:#080d18;color:#91a8c5}
.product button{margin-top:5px}
</style>

<div class="container">
 <section id="productPage" class="panel hidden"></section>

 <section id="orderPage" class="panel hidden">
  <h2>إتمام الطلب</h2>
  <form id="orderForm">
   <label>الاسم</label><input name="first" required>
   <label>اللقب</label><input name="last" required>
   <label>رقم الهاتف</label><input name="phone" type="tel" required>
   <label>الولاية</label>
   <select name="wilaya" required>
    <option value="">اختر الولاية</option>
    <option>قسنطينة</option><option>الجزائر</option>
    <option>وهران</option><option>سطيف</option>
    <option>عنابة</option><option>باتنة</option>
    <option>تيزي وزو</option><option>البليدة</option>
   </select>
   <label>العنوان بالتفصيل</label><textarea name="address" required></textarea>
   <label>المنتج</label><input name="product" id="orderProduct" readonly>
   <label>الكمية</label><input name="quantity" type="number" min="1" value="1" required>
   <button type="submit">تأكيد الطلب</button>
  </form>
  <p id="orderMessage"></p>
 </section>

 <section id="adminPage" class="panel hidden">
  <h2>لوحة إدارة GM STORE</h2>
  <div id="login">
   <input id="password" type="password" placeholder="كلمة مرور المدير">
   <button onclick="login()">دخول</button>
  </div>
  <div id="adminArea" class="hidden">
   <h3>إضافة أو تعديل منتج</h3>
   <input id="pname" placeholder="اسم المنتج">
   <input id="pprice" type="number" placeholder="السعر بالدينار">
   <input id="pimage" placeholder="رابط صورة المنتج">
   <textarea id="pdesc" placeholder="وصف المنتج"></textarea>
   <button onclick="saveProduct()">حفظ المنتج</button>
   <button class="secondary" onclick="logout()">خروج</button>
   <h3>المنتجات</h3><div id="adminProducts"></div>
   <h3>الطلبات المسجلة على هذا الجهاز</h3><div id="orders"></div>
  </div>
 </section>
</div>

<footer>GM STORE © 2026 | جميع الحقوق محفوظة</footer>

<script>
let products=JSON.parse(localStorage.getItem("gm_products")||"[]");
let orders=JSON.parse(localStorage.getItem("gm_orders")||"[]");
let editId=null;

function save(){
 localStorage.setItem("gm_products",JSON.stringify(products));
 localStorage.setItem("gm_orders",JSON.stringify(orders));
}
function show(id){
 ["productPage","orderPage","adminPage"].forEach(x=>
 document.getElementById(x).classList.add("hidden"));
 if(id)document.getElementById(id).classList.remove("hidden");
 window.scrollTo(0,0);
}
function safe(s){
 return String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}
function render(){
 let area=document.getElementById("products");
 if(area)area.innerHTML=products.map((p,i)=>`
 <article class="product">
 <img src="${safe(p.image)}" alt="${safe(p.name)}"
 onerror="this.src='https://placehold.co/600x400/101a2b/ffffff?text=GM+STORE'">
 <div class="product-info">
 <h3>${safe(p.name)}</h3>
 <div class="price">${Number(p.price).toLocaleString()} دج</div>
 <p class="muted">${safe(p.desc)}</p>
 <div class="actions">
 <button onclick="details(${i})">التفاصيل</button>
 <button onclick="buy(${i})">اطلب الآن</button>
 </div></div></article>`).join("")||"<p>لا توجد منتجات حالياً.</p>";
}
function details(i){
 let p=products[i];
 let el=document.getElementById("productPage");
 el.innerHTML=`<img style="width:100%;max-height:350px;object-fit:contain" src="${safe(p.image)}">
 <h2>${safe(p.name)}</h2><h3 class="price">${Number(p.price).toLocaleString()} دج</h3>
 <p>${safe(p.desc)}</p><button onclick="buy(${i})">اطلب الآن</button>
 <button class="secondary" onclick="show(null)">رجوع</button>`;
 show("productPage");
}
function buy(i){
 document.getElementById("orderProduct").value=products[i].name;
 show("orderPage");
}
document.getElementById("orderForm").addEventListener("submit",e=>{
 e.preventDefault();
 let data=Object.fromEntries(new FormData(e.target).entries());
 orders.push({...data,date:new Date().toLocaleString("ar-DZ")});
 save();
 document.getElementById("orderMessage").textContent=
 "تم تسجيل الطلب على هذا الجهاز التجريبي.";
 e.target.reset();
});
function login(){
 if(document.getElementById("password").value==="GM2026!"){
 document.getElementById("login").classList.add("hidden");
 document.getElementById("adminArea").classList.remove("hidden");
 adminRender();
 }else alert("كلمة المرور غير صحيحة");
}
function logout(){
 document.getElementById("adminArea").classList.add("hidden");
 document.getElementById("login").classList.remove("hidden");
 document.getElementById("password").value="";
}
function saveProduct(){
 let name=document.getElementById("pname").value.trim();
 let price=Number(document.getElementById("pprice").value);
 let image=document.getElementById("pimage").value.trim();
 let desc=document.getElementById("pdesc").value.trim();
 if(!name||price<=0){alert("أدخل اسم المنتج وسعراً صحيحاً");return}
 let p={name,price,image,desc};
 if(editId===null)products.push(p);else products[editId]=p;
 editId=null;save();render();adminRender();
 ["pname","pprice","pimage","pdesc"].forEach(id=>document.getElementById(id).value="");
}
function adminRender(){
 document.getElementById("adminProducts").innerHTML=products.map((p,i)=>`
 <div class="panel"><b>${safe(p.name)}</b> — ${Number(p.price)} دج
 <button onclick="editProduct(${i})">تعديل</button>
 <button onclick="deleteProduct(${i})">حذف</button></div>`).join("");
 document.getElementById("orders").innerHTML=orders.map(o=>`
 <div class="panel"><b>${safe(o.first)} ${safe(o.last)}</b>
 <p>${safe(o.phone)} — ${safe(o.wilaya)}</p>
 <p>${safe(o.product)} × ${safe(o.quantity)}</p>
 <p>${safe(o.address)}</p><small>${safe(o.date)}</small></div>`).join("")||"لا توجد طلبات.";
}
function editProduct(i){
 let p=products[i];editId=i;
 document.getElementById("pname").value=p.name;
 document.getElementById("pprice").value=p.price;
 document.getElementById("pimage").value=p.image;
 document.getElementById("pdesc").value=p.desc;
}
function deleteProduct(i){
 if(confirm("هل تريد حذف المنتج؟")){
 products.splice(i,1);save();render();adminRender();
 }
}
render();
</script>
</body>
</html>
